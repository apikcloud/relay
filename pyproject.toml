[project]
name = "relay"
version = "0.3.1"
description = "Shared lightweight service clients over a common httpx transport."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]   # base: all core + notify need only this

[project.optional-dependencies]
# Placeholders. If a client is pure-httpx today, leave its extra empty
# (or drop it) — it still marks the boundary and gives future deps a home.
github  = []
datahub = []
notify = []
bucket_manager = []
monitoring = []
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]
